<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GOLDX | منصة الأرباح الرقمية</title>
  <style>
    :root { --gold: #ffd700; --dark-gold: #b8860b; --bg: #060913; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: radial-gradient(circle at top, #1a1a00, var(--bg)); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; }
    .hero-card { width: 90%; max-width: 450px; background: rgba(12, 18, 45, 0.85); border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 35px; padding: 40px; text-align: center; backdrop-filter: blur(20px); box-shadow: 0 25px 60px rgba(0,0,0,0.6); position: relative; }
    .hero-card::before { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.3), transparent); border-radius: 35px; z-index: -1; }
    .main-logo { width: 90px; height: 90px; background: linear-gradient(135deg, var(--gold), var(--dark-gold)); margin: 0 auto 25px; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 900; color: #000; box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); }
    h1 { font-size: 32px; color: var(--gold); margin: 0 0 15px; letter-spacing: 1px; }
    p { color: #a8b3cf; line-height: 1.8; font-size: 16px; margin-bottom: 35px; }
    .cta-btn { display: block; width: 100%; padding: 18px; border-radius: 20px; background: linear-gradient(135deg, var(--gold), var(--dark-gold)); color: #000; font-weight: 800; text-decoration: none; font-size: 18px; transition: 0.4s; box-sizing: border-box; }
    .cta-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(255, 215, 0, 0.3); }
    .nav-links { margin-top: 25px; display: flex; justify-content: center; gap: 20px; font-size: 14px; }
    .nav-links a { color: var(--gold); text-decoration: none; opacity: 0.8; transition: 0.3s; }
    .nav-links a:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="hero-card">
    <div class="main-logo">G</div>
    <h1>GOLDX</h1>
    <p>مرحباً بك في المنصة الرائدة لجمع الذهب الرقمي. نفذ المهام البسيطة، ابنِ فريقك الخاص، واسحب أرباحك بكل سهولة وأمان.</p>
    <a href="auth/login.html" class="cta-btn">ابدأ رحلة الربح الآن</a>
    <div class="nav-links">
      <a href="auth/signup.html">إنشاء حساب جديد</a>
      <a href="#">مركز الدعم</a>
    </div>
  </div>
</body>
</html>
