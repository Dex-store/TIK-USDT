<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>شبكة الإحالات • GOLD-X</title>
  <style>
    :root {
      --gold: #ffd700;
      --bg: #0b0c10;
      --card-bg: #1f2128;
      --border-color: rgba(255, 215, 0, 0.15);
      --text-gray: #a8b3cf;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2e2600, var(--bg));
      color: #eaf0ff;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 18px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 14px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .btn {
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: rgba(255, 215, 0, 0.05);
      color: var(--gold);
      font-weight: 700;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover {
      background: rgba(255, 215, 0, 0.15);
      border-color: var(--gold);
    }
    .main-card {
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    .kpi-container {
      display: flex;
      gap: 12px;
      margin: 16px 0;
    }
    .kpi-box {
      flex: 1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }
    .kpi-val {
      font-size: 24px;
      font-weight: 900;
      margin-top: 4px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .ref-input-wrapper {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #12141c;
      color: #eaf0ff;
      outline: none;
      box-sizing: border-box;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    input:focus {
      border-color: var(--gold);
    }
    .muted { color: var(--text-gray); font-size: 13px; line-height: 1.6; }
    .msg { margin-top: 10px; font-size: 13px; font-weight: bold; color: #2cff8f; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div style="display:flex; flex-direction:column;">
      <div style="font-weight:900; color: #fff; font-size: 16px;">شبكة الإحالات والشركاء</div>
      <div class="muted" style="font-size: 11px;">تتبع أرباحك وتكبير فريقك</div>
    </div>
    <div>
      <a class="btn" href="dashboard.html">📊 لوحة التحكم</a>
    </div>
  </div>

  <div class="main-card">
    <div style="font-weight:900; font-size:16px; color: var(--gold); margin-bottom: 6px;">رابط الإحالة الخاص بك</div>
    <div class="muted">
      قم بنسخ الرابط أدناه ومشاركته. ستحصل على عمولات فورية عند قيام أي عضو بالتسجيل وتفعيل حسابه من خلالك.
    </div>
    
    <div class="ref-input-wrapper">
      <input id="refLinkInput" readonly value="جاري إنشاء الرابط...">
      <button class="btn" id="copyLinkBtn" style="white-space: nowrap;">📋 نسخ الرابط</button>
    </div>
    <div id="copyMsg" class="msg" style="display:none;"></div>
  </div>

  <div class="main-card">
    <div style="font-weight:900; font-size:16px; color: #fff; margin-bottom: 12px;">ملخص الشبكة</div>
    
    <div class="kpi-container">
      <div class="kpi-box">
        <div class="muted" style="font-size:12px;">إجمالي الإحالات</div>
        <div class="kpi-val" style="color: var(--gold);" id="totalRefsTxt">0</div>
      </div>
      <div class="kpi-box">
        <div class="muted" style="font-size:12px;">الأعضاء النشطين</div>
        <div class="kpi-val" style="color: #2cff8f;" id="activeRefsTxt">0</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/parse/dist/parse.min.js"></script>
<script src="./config.js"></script>
<script>
  Parse.initialize(window.GOLDX.PARSE_APP_ID, window.GOLDX.PARSE_JS_KEY);
  Parse.serverURL = window.GOLDX.PARSE_SERVER_URL;

  const user = Parse.User.current();
  if (!user) location.href = "../auth/login.html";

  // توليد رابط الإحالة تلقائياً بناءً على موقع المنصة الحالي واسم المستخدم
  function generateReferralLink() {
    const username = user.get("username") || user.id;
    // يقوم بجلب مسار الموقع الرئيسي تلقائياً ليناسب الاستضافة الحالية
    const baseUrl = window.location.origin + window.location.pathname.replace("app/referrals.html", "");
    const fullRefLink = `${baseUrl}auth/register.html?ref=${username}`;
    document.getElementById("refLinkInput").value = fullRefLink;
  }

  // جلب إحصائيات الإحالات من قاعدة البيانات بشكل حقيقي
  async function loadReferralStats() {
    try {
      const username = user.get("username");
      if (!username) return;

      // استعلام لجلب المستخدمين الذين تم تسجيلهم بواسطة هذا المستخدم
      const userQuery = new Parse.Query(Parse.User);
      userQuery.equalTo("referredBy", username); // تأكد أن الحقل في الـ DB لديك يسمى referredBy
      const referredUsers = await userQuery.find();

      document.getElementById("totalRefsTxt").textContent = referredUsers.length;

      // تصفية الأعضاء النشطين (الذين يملكون حقل isActive مساوي لـ true في جدول الـ Profile الخاص بهم أو الـ User)
      let activeCount = 0;
      for (let u of referredUsers) {
        if (u.get("isActive") === true) {
          activeCount++;
        }
      }
      document.getElementById("activeRefsTxt").textContent = activeCount;
    } catch (e) {
      console.error("Error loading referral stats:", e);
    }
  }

  // تفعيل كود زر النسخ
  document.getElementById("copyLinkBtn").onclick = async () => {
    const input = document.getElementById("refLinkInput");
    const msg = document.getElementById("copyMsg");
    try {
      await navigator.clipboard.writeText(input.value);
      msg.style.display = "block";
      msg.textContent = "تم نسخ رابط الإحالة الخاص بك بنجاح! ✅";
      setTimeout(() => { msg.style.display = "none"; }, 3000);
    } catch (err) {
      msg.style.display = "block";
      msg.style.color = "#ff5a78";
      msg.textContent = "فشل النسخ التلقائي، يرجى نسخه يدوياً.";
    }
  };

  // التنفيذ عند فتح الصفحة
  generateReferralLink();
  loadReferralStats();
</script>
</body>
</html>
