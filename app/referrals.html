<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>شبكة الإحالات • GOLD-X</title>
  <style>
    :root {
      --gold: #ffd700;
      --bg: #0b0c10;
      --card-bg: #1f2128;
      --border-color: rgba(255, 215, 0, 0.15);
      --text-gray: #a8b3cf;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2e2600, var(--bg));
      color: #eaf0ff;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 18px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 14px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .btn {
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: rgba(255, 215, 0, 0.05);
      color: var(--gold);
      font-weight: 700;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover {
      background: rgba(255, 215, 0, 0.15);
      border-color: var(--gold);
    }
    .main-card {
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    .kpi-container {
      display: flex;
      gap: 12px;
      margin: 16px 0;
    }
    .kpi-box {
      flex: 1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }
    .kpi-val {
      font-size: 24px;
      font-weight: 900;
      margin-top: 4px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .ref-input-wrapper {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #12141c;
      color: #eaf0ff;
      outline: none;
      box-sizing: border-box;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    input:focus {
      border-color: var(--gold);
    }
    .muted { color: var(--text-gray); font-size: 13px; line-height: 1.6; }
    .msg { margin-top: 10px; font-size: 13px; font-weight: bold; color: #2cff8f; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div style="display:flex; flex-direction:column;">
      <div style="font-weight:900; color: #fff; font-size: 16px;">شبكة الإحالات والشركاء</div>
      <div class="muted" style="font-size: 11px;">تتبع أرباحك وتكبير فريقك</div>
    </div>
    <div>
      <a class="btn" href="dashboard.html">📊 لوحة التحكم</a>
    </div>
  </div>

  <div class="main-card">
    <div style="font-weight:900; font-size:16px; color: var(--gold); margin-bottom: 6px;">رابط الإحالة الخاص بك</div>
    <div class="muted">
      قم بنسخ الرابط المدمج برمز الإحالة الفريد والخاص بك المعتمد من النظام.
    </div>
    
    <div class="ref-input-wrapper">
      <input id="refLinkInput" readonly value="جاري قراءة الـ refCode من حسابك...">
      <button class="btn" id="copyLinkBtn" style="white-space: nowrap;">📋 نسخ الرابط</button>
    </div>
    <div id="copyMsg" class="msg" style="display:none;"></div>
  </div>

  <div class="main-card">
    <div style="font-weight:900; font-size:16px; color: #fff; margin-bottom: 12px;">ملخص الشبكة</div>
    
    <div class="kpi-container">
      <div class="kpi-box">
        <div class="muted" style="font-size:12px;">إجمالي الإحالات</div>
        <div class="kpi-val" style="color: var(--gold);" id="totalRefsTxt">0</div>
      </div>
      <div class="kpi-box">
        <div class="muted" style="font-size:12px;">الأعضاء النشطين</div>
        <div class="kpi-val" style="color: #2cff8f;" id="activeRefsTxt">0</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/parse/dist/parse.min.js"></script>
<script src="./config.js"></script>
<script>
  try {
    if (window.GOLDX && window.GOLDX.PARSE_APP_ID) {
      Parse.initialize(window.GOLDX.PARSE_APP_ID, window.GOLDX.PARSE_JS_KEY);
      Parse.serverURL = window.GOLDX.PARSE_SERVER_URL;
    }
  } catch(e) {
    console.error("Parse initialization error:", e);
  }

  const user = Parse.User.current();
  if (!user) {
    location.href = "../auth/login.html";
  }

  // دالة توليد الرابط بناءً على حقل refCode الحقيقي الموضح في لقطات الشاشة
  function generateReferralLink() {
    if(!user) return;
    
    // سحب الـ refCode الأصلي والفريد المخزن في جدول المستخدم (مثل MKDB56)
    const dbRefCode = user.get("refCode"); 
    
    if(!dbRefCode) {
      document.getElementById("refLinkInput").value = "خطأ: لم يتم العثور على refCode في حسابك.";
      return;
    }
    
    const currentUrl = window.location.href;
    const baseDir = currentUrl.substring(0, currentUrl.lastIndexOf("/app/"));
    
    // دمج الـ refCode المتطابق تماماً مع الباكيند
    const fullRefLink = `${baseDir}/auth/signup.html?ref=${dbRefCode}`;
    document.getElementById("refLinkInput").value = fullRefLink;
  }

  // جلب إحصائيات الإحالات من خلال مطابقة الـ refCode مع الـ pendingRefCode للمسجلين الجدد
  async function loadReferralStats() {
    if(!user) return;
    try {
      const dbRefCode = user.get("refCode");
      if(!dbRefCode) return;

      const userQuery = new Parse.Query(Parse.User);
      // البحث عن الأعضاء الذين تم تخزين الـ refCode الخاص بك في حقل pendingRefCode لديهم
      userQuery.equalTo("pendingRefCode", dbRefCode);
      const referredUsers = await userQuery.find();

      document.getElementById("totalRefsTxt").textContent = referredUsers.length;

      // حساب الأعضاء النشطين بناءً على خطة الاشتراك المكتملة أو قيمة الـ balance
      let activeCount = 0;
      for (let u of referredUsers) {
        // إذا كان الحساب يمتلك رصيد تفعيل أو مسجل به قيمة خطة في الباكيند
        if (u.get("Plans") || u.get("balance") > 0) {
          activeCount++;
        }
      }
      document.getElementById("activeRefsTxt").textContent = activeCount;
    } catch (e) {
      console.error("Error fetching network stats from Back4App:", e);
    }
  }

  document.getElementById("copyLinkBtn").onclick = async () => {
    const input = document.getElementById("refLinkInput");
    const msg = document.getElementById("copyMsg");
    try {
      await navigator.clipboard.writeText(input.value);
      msg.style.display = "block";
      msg.className = "msg";
      msg.textContent = "تم نسخ رابط الإحالة الرسمي والمتطابق بنجاح! ✅";
      setTimeout(() => { msg.style.display = "none"; }, 3000);
    } catch (err) {
      msg.style.display = "block";
      msg.style.color = "#ff5a78";
      msg.textContent = "يرجى تحديد النص ونسخه يدوياً.";
    }
  };

  // التنفيذ المباشر فور التحقق من وجود المستخدم
  if (user) {
    // نقوم بعمل تحديث لبيانات جلسة المستخدم الحالية لضمان جلب الـ refCode فوراً من الباكيند
    user.fetch().then(() => {
      generateReferralLink();
      loadReferralStats();
    }).catch(() => {
      generateReferralLink();
      loadReferralStats();
    });
  }
</script>
</body>
</html>
