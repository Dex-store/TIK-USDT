<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>إحالاتي • GOLD-X</title>
  <style>
    :root {
      --gold: #ffd700;
      --bg: #0b0c10; /* أسود داكن فخم */
      --card-bg: #1f2128; /* رمادي داكن لبروز بطاقات الإحالات */
      --border-color: rgba(255, 215, 0, 0.15);
      --text-gray: #a8b3cf;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2e2600, var(--bg)); /* التدرج الذهبي الفخم المشع */
      color: #eaf0ff;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 14px 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .btn {
      padding: 11px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: #eaf0ff;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: 0.3s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--gold);
    }
    .card {
      margin-top: 14px;
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    .item {
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.02);
      margin-top: 12px;
      transition: 0.3s;
    }
    .item:hover {
      border-color: rgba(255, 215, 0, 0.3);
      background: rgba(255, 215, 0, 0.01);
    }
    .muted {
      color: var(--text-gray);
      font-size: 13px;
      line-height: 1.7;
    }
    .mono {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      word-break: break-all;
    }
    .highlight-gold {
      color: var(--gold);
      font-weight: 900;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div style="font-weight:900; font-size: 18px; color: var(--gold);">إحالاتي</div>
      <div class="muted">الأشخاص الذين سجلوا عبر رابطك</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn" href="./dashboard.html">لوحة التحكم</a>
      <a class="btn" href="./commissions.html">عمولاتي</a>
      <button class="btn" id="refreshBtn" style="background: rgba(255,215,0,0.1); color: var(--gold); border-color: rgba(255,215,0,0.2);">تحديث</button>
    </div>
  </div>

  <div class="card">
    <div class="muted" id="msg">—</div>
    <div id="list"></div>
  </div>
</div>

<script src="https://unpkg.com/parse/dist/parse.min.js"></script>
<script src="./config.js"></script>
<script>
  // تهيئة الاتصال باستخدام كائن المنصة الجديد GOLDX
  Parse.initialize(window.GOLDX.PARSE_APP_ID, window.GOLDX.PARSE_JS_KEY);
  Parse.serverURL = window.GOLDX.PARSE_SERVER_URL;

  const user = Parse.User.current();
  if(!user) location.href = "../auth/login.html";

  const msg = (t)=> document.getElementById("msg").textContent = t;
  function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

  async function load(){
    msg("جاري التحميل...");
    list.innerHTML = "";

    const Referrals = Parse.Object.extend("Referrals");
    const q = new Parse.Query(Referrals);
    q.equalTo("referrer", user);
    q.descending("createdAt");
    q.limit(100);
    q.include("referred");

    const rows = await q.find().catch(e=>{ msg(e.message||"خطأ أثناء التحميل"); return []; });
    if(!rows.length){ msg("لا توجد إحالات بعد."); return; }

    msg("عدد الإحالات النشطة: " + rows.length);

    rows.forEach(r=>{
      const referred = r.get("referred");
      const email = referred ? (referred.get("email") || referred.get("username") || "—") : "—";
      const st = r.get("status") || "active";

      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `
        <div><b class="highlight-gold">المستخدم:</b> <span class="mono">${esc(email)}</span></div>
        <div class="muted"><b style="color: #fff;">الحالة:</b> ${esc(st)} | <b>التاريخ:</b> ${esc(r.createdAt ? r.createdAt.toISOString().split('T')[0] : "")}</div>
      `;
      list.appendChild(el);
    });
  }

  refreshBtn.onclick = load;
  load();
</script>
</body>
</html>
