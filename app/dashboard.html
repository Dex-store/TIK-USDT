<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GOLDX | لوحة التحكم</title>
  <!-- استدعاء خط Cairo وتصميم الأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --main-blue: #004aad;
      --light-bg: #f4f7fe;
      --white: #ffffff;
      --text-dark: #1a1a1a;
      --text-gray: #7d8592;
    }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      padding-bottom: 80px; /* لترك مساحة للقائمة السفلية */
    }

    /* الجزء العلوي - الخلفية الزرقاء */
    .header-section {
      background: linear-gradient(180deg, #003380 0%, #004aad 100%);
      padding: 20px 20px 100px;
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
      color: white;
      text-align: center;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: right;
    }

    .avatar {
      width: 45px;
      height: 45px;
      background: #eee;
      border-radius: 50%;
      border: 2px solid var(--white);
    }

    /* بطاقة الرصيد الرئيسية */
    .balance-card {
      background: var(--white);
      border-radius: 25px;
      margin: -80px 20px 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .stat-item { text-align: center; flex: 1; }
    .stat-label { font-size: 12px; color: var(--text-gray); }
    .stat-value { font-size: 20px; font-weight: 900; color: var(--main-blue); }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-main {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-blue { background: var(--main-blue); color: white; }
    .btn-outline { background: white; border: 1px solid var(--main-blue); color: var(--main-blue); }

    /* شبكة الإحصائيات الصغيرة */
    .mini-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 20px;
      margin-bottom: 20px;
    }

    .mini-card {
      background: white;
      padding: 15px 5px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .mini-card i { font-size: 18px; margin-bottom: 8px; }
    .mini-card .val { display: block; font-weight: bold; font-size: 14px; }
    .mini-card .lbl { font-size: 10px; color: var(--text-gray); }

    /* أيقونات الخدمات الدائرية */
    .services-grid {
      display: flex;
      justify-content: space-around;
      padding: 20px;
      background: white;
      margin: 0 20px 20px;
      border-radius: 20px;
    }

    .service-item { text-align: center; cursor: pointer; }
    .icon-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 8px;
      font-size: 20px;
    }

    /* هيكل الفريق */
    .team-section {
      background: white;
      margin: 0 20px;
      padding: 20px;
      border-radius: 20px;
    }

    /* شريط التنقل السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 15px 0;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
      border-top-left-radius: 25px;
      border-top-right-radius: 25px;
    }

    .nav-item { text-align: center; color: var(--text-gray); font-size: 12px; flex: 1; text-decoration: none; }
    .nav-item.active { color: var(--main-blue); }
    .nav-item i { display: block; font-size: 20px; margin-bottom: 4px; }

    .center-nav {
      position: relative;
      top: -30px;
      background: var(--main-blue);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white !important;
      box-shadow: 0 5px 15px rgba(0,74,173,0.4);
    }
  </style>
</head>
<body>

  <!-- الجزء العلوي -->
  <div class="header-section">
    <div class="top-bar">
      <i class="fas fa-bars"></i>
      <div class="user-profile">
        <div>
          <div style="font-weight: bold; font-size: 14px;">مرحباً، <span id="userName">أحمد</span></div>
          <div style="font-size: 11px; color: #ffd700;"><i class="fas fa-medal"></i> عضو ذهبي</div>
        </div>
        <div class="avatar"></div>
      </div>
      <i class="fas fa-bell"></i>
    </div>
    <div style="margin-top: 20px;">
      <h3 style="margin: 0;">نظام التسلسل الهرمي</h3>
      <p style="font-size: 12px; opacity: 0.8;">ادعُ الآخرين وابنِ فريقك واربح المزيد</p>
    </div>
  </div>

  <!-- بطاقة الرصيد -->
  <div class="balance-card">
    <div class="stats-row">
      <div class="stat-item" style="border-left: 1px solid #eee;">
        <div class="stat-label">الرصيد الحالي</div>
        <div class="stat-value" id="currentBal">2,350.00</div>
        <div style="font-size: 10px; color: var(--text-gray);">دولار أمريكي</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">إجمالي الأرباح</div>
        <div class="stat-value" id="totalEarn">12,540.00</div>
        <div style="font-size: 10px; color: var(--text-gray);">دولار أمريكي</div>
      </div>
    </div>
    <div class="card-actions">
      <button class="btn-main btn-blue"><i class="fas fa-download"></i> سحب الأرباح</button>
      <button class="btn-main btn-outline"><i class="fas fa-chart-line"></i> عرض التفاصيل</button>
    </div>
  </div>

  <!-- شبكة الإحصائيات -->
  <div class="mini-stats">
    <div class="mini-card">
      <i class="fas fa-wallet" style="color: #ff9800;"></i>
      <span class="val">560.00</span>
      <span class="lbl">أرباح اليوم</span>
    </div>
    <div class="mini-card">
      <i class="fas fa-sitemap" style="color: #9c27b0;"></i>
      <span class="val">7</span>
      <span class="lbl">مستويات العمق</span>
    </div>
    <div class="mini-card">
      <i class="fas fa-users" style="color: #004aad;"></i>
      <span class="val">23</span>
      <span class="lbl">المستوى الأول</span>
    </div>
    <div class="mini-card">
      <i class="fas fa-user-friends" style="color: #4caf50;"></i>
      <span class="val">128</span>
      <span class="lbl">إجمالي الفريق</span>
    </div>
  </div>

  <!-- الخدمات -->
  <div class="services-grid">
    <div class="service-item">
      <div class="icon-circle" style="background: #00bcd4;"><i class="fas fa-chart-pie"></i></div>
      <div class="stat-label">التقارير</div>
    </div>
    <div class="service-item">
      <div class="icon-circle" style="background: #2196f3;"><i class="fas fa-dollar-sign"></i></div>
      <div class="stat-label">الأرباح</div>
    </div>
    <div class="service-item">
      <div class="icon-circle" style="background: #ff5722;"><i class="fas fa-users-cog"></i></div>
      <div class="stat-label">فريقي</div>
    </div>
    <div class="service-item">
      <div class="icon-circle" style="background: #4caf50;"><i class="fas fa-link"></i></div>
      <div class="stat-label" style="font-size: 10px;">رابط الدعوة</div>
    </div>
  </div>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item"><i class="fas fa-chart-bar"></i>التقارير</a>
    <a href="#" class="nav-item"><i class="fas fa-wallet"></i>المحفظة</a>
    <a href="#" class="nav-item active center-nav"><i class="fas fa-home"></i></a>
    <a href="#" class="nav-item"><i class="fas fa-question-circle"></i>المساعدة</a>
    <a href="#" class="nav-item"><i class="fas fa-user"></i>الحساب</a>
  </nav>

  <!-- برمجة الربط مع Back4App -->
  <script src="https://unpkg.com/parse/dist/parse.min.js"></script>
  <script>
    Parse.initialize("8KYckDDwKPakgqNYPCZ2NcqDpGMsII3ZnMTE5RTx", "uSV2StUZpizr8aoGUYpBJMZyKxwtXhGstQd8HZaF");
    Parse.serverURL = "https://parseapi.back4app.com/";

    const user = Parse.User.current();
    if(user) {
      document.getElementById('userName').textContent = user.get('username').split('@')[0];
      document.getElementById('currentBal').textContent = (user.get('balance') || 0).toLocaleString();
      // يمكنك إضافة استعلامات أخرى لجلب إجمالي الفريق والأرباح
    } else {
      window.location.href = "auth/login.html";
    }
  </script>
</body>
</html>
