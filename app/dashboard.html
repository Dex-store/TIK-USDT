<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>لوحة التحكم • GOLD-X</title>
  <style>
    :root {
      --gold: #ffd700;
      --bg: #0b0c10;
      --card-bg: #1f2128;
      --border-color: rgba(255, 215, 0, 0.15);
      --text-gray: #a8b3cf;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2e2600, var(--bg));
      color: #eaf0ff;
    }
    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 18px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 14px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .user-info {
      display: flex;
      flex-direction: column;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 90, 120, 0.2);
      background: rgba(255, 90, 120, 0.05);
      color: #ff5a78;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn:hover {
      background: rgba(255, 90, 120, 0.15);
      border-color: #ff5a78;
    }
    .main-card {
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      text-align: center;
    }
    .balance-title {
      color: var(--text-gray);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .balance-num {
      font-size: 42px;
      font-weight: 900;
      color: var(--gold);
      margin: 10px 0;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .status-pill {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      margin-top: 5px;
    }
    .status-pill.active {
      color: #2cff8f;
      background: rgba(44, 255, 143, 0.06);
      border: 1px solid rgba(44, 255, 143, 0.25);
    }
    .status-pill.inactive {
      color: #ff5a78;
      background: rgba(255, 90, 120, 0.06);
      border: 1px solid rgba(255, 90, 120, 0.25);
    }
    .menu-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 215, 0, 0.05);
      padding: 16px 20px;
      border-radius: 18px;
      text-decoration: none;
      color: #eaf0ff;
      font-weight: 700;
      font-size: 15px;
      transition: 0.3s;
    }
    .menu-item:hover {
      border-color: var(--gold);
      background: rgba(255, 215, 0, 0.03);
      transform: translateX(-4px);
    }
    .menu-icon {
      font-size: 18px;
      color: var(--gold);
    }
    .mono {
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="user-info">
      <div style="font-weight:900; color: #fff; font-size: 18px;">لوحة التحكّم</div>
      <div class="muted mono" id="userEmail" style="font-size: 12px; margin-top: 2px;">جاري التحميل...</div>
    </div>
    <button class="btn" id="logoutBtn">خروج</button>
  </div>

  <div class="main-card">
    <div class="balance-title">إجمالي الرصيد المتاح (USDT)</div>
    <div class="balance-num" id="balanceTxt">0.00</div>
    <div id="statusWrapper">
      <span class="status-pill inactive" id="statusPill">فحص الحساب...</span>
    </div>
  </div>

  <div class="menu-list">
    <a class="menu-item" href="./subscriptions.html">
      <span>💳 خطط الاشتراك وتفعيل الحساب</span>
      <span class="menu-icon">←</span>
    </a>
    <a class="menu-item" href="./withdraw-request.html">
      <span>💰 تقديم طلب سحب جديد</span>
      <span class="menu-icon">←</span>
    </a>
    <a class="menu-item" href="./withdraw-history.html">
      <span>📜 مراجعة سجل السحوبات</span>
      <span class="menu-icon">←</span>
    </a>
    <a class="menu-item" href="./referrals.html">
      <span>👥 شبكة الإحالات والمستخدمين</span>
      <span class="menu-icon">←</span>
    </a>
  </div>
</div>

<script src="https://unpkg.com/parse/dist/parse.min.js"></script>
<script src="./config.js"></script>
<script>
  // ضبط اتصال قاعدة البيانات بـ GOLDX
  Parse.initialize(window.GOLDX.PARSE_APP_ID, window.GOLDX.PARSE_JS_KEY);
  Parse.serverURL = window.GOLDX.PARSE_SERVER_URL;

  const user = Parse.User.current();
  if(!user) location.href = "../auth/login.html";

  // تعيين البريد الفعلي
  document.getElementById("userEmail").textContent = user.get("email") || user.get("username") || "—";

  function safeNum(n){ return (typeof n === "number" && isFinite(n)) ? n : 0; }

  async function getProfile(){
    const Profile = Parse.Object.extend("Profile");
    const q = new Parse.Query(Profile);
    q.equalTo("user", user);
    q.limit(1);
    return await q.first();
  }

  async function loadDashboard(){
    try {
      const profile = await getProfile();
      
      // قراءة الحقول المالية الحقيقية المتطابقة مع طلب السحب
      const bal = profile ? safeNum(profile.get("virtualBalance")) || safeNum(profile.get("balance")) || 0 : 0;
      const isActive = !!(profile && profile.get("isActive"));

      document.getElementById("balanceTxt").textContent = bal.toFixed(2);
      
      const pill = document.getElementById("statusPill");
      if(isActive) {
        pill.className = "status-pill active";
        pill.textContent = "حساب نشط ومفعل";
      } else {
        pill.className = "status-pill inactive";
        pill.textContent = "الحساب غير نشط - يتطلب اشتراك";
      }
    } catch(e) {
      console.error("Error loading dashboard:", e);
    }
  }

  document.getElementById("logoutBtn").onclick = async () => {
    await Parse.User.logOut();
    location.href = "../auth/login.html";
  };

  loadDashboard();
</script>
</body>
</html>
