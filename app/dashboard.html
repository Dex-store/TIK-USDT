<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>لوحة التحكم • GOLD-X</title>
  <style>
    :root {
      --gold: #ffd700;
      --bg: #0b0c10;
      --card-bg: #1f2128;
      --border-color: rgba(255, 215, 0, 0.15);
      --text-gray: #a8b3cf;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2e2600, var(--bg));
      color: #eaf0ff;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 18px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 14px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 215, 0, 0.1);
      font-weight: bold;
      color: var(--gold);
    }
    .btn-logout {
      padding: 9px 15px;
      border-radius: 14px;
      border: 1px solid rgba(255, 90, 120, 0.2);
      background: rgba(255, 90, 120, 0.05);
      color: #ff5a78;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      transition: 0.3s;
    }
    .btn-logout:hover {
      background: rgba(255, 90, 120, 0.15);
      border-color: #ff5a78;
    }
    .main-card {
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px 20px;
      margin-top: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      text-align: center;
    }
    .balance-title {
      color: var(--text-gray);
      font-size: 14px;
      font-weight: 600;
    }
    .balance-num {
      font-size: 44px;
      font-weight: 900;
      color: var(--gold);
      margin: 12px 0;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .status-badge.active {
      color: #2cff8f;
      background: rgba(44, 255, 143, 0.06);
      border: 1px solid rgba(44, 255, 143, 0.25);
    }
    .status-badge.inactive {
      color: #ff5a78;
      background: rgba(255, 90, 120, 0.06);
      border: 1px solid rgba(255, 90, 120, 0.25);
    }
    .navigation-links {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(31, 33, 40, 0.5);
      border: 1px solid rgba(255, 215, 0, 0.05);
      padding: 18px 20px;
      border-radius: 18px;
      text-decoration: none;
      color: #eaf0ff;
      font-weight: 700;
      font-size: 15px;
      transition: 0.3s;
      backdrop-filter: blur(5px);
    }
    .link-item:hover {
      border-color: var(--gold);
      background: rgba(255, 215, 0, 0.03);
      transform: translateX(-4px);
    }
    .arrow {
      font-size: 16px;
      color: var(--gold);
      transition: 0.3s;
    }
    .link-item:hover .arrow {
      transform: translateX(-2px);
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="user-profile">
      <div class="avatar" id="userInitial">U</div>
      <div>
        <div style="font-weight:900; color: #fff; font-size: 15px;" id="usernameTxt">المستخدم</div>
        <div class="muted" style="font-size: 11px; margin-top: 1px;">عضو المنصة</div>
      </div>
    </div>
    <button class="btn-logout" id="logoutBtn">خروج</button>
  </div>

  <div class="main-card">
    <div class="balance-title">الرصيد المتاح الحالي (USDT)</div>
    <div class="balance-num" id="balanceTxt">0.00</div>
    <div>
      <span class="status-badge inactive" id="statusBadge">غير نشط - يتطلب اشتراك</span>
    </div>
  </div>

  <div class="navigation-links">
    <a class="link-item" href="plans.html">
      <span>💳 خطط الاشتراك وتفعيل الحساب</span>
      <span class="arrow">←</span>
    </a>
    <a class="link-item" href="withdraw-request.html">
      <span>💰 تقديم طلب سحب جديد</span>
      <span class="arrow">←</span>
    </a>
    <a class="link-item" href="withdraw-history.html">
      <span>📜 عرض سجل السحوبات المالي</span>
      <span class="arrow">←</span>
    </a>
    <a class="link-item" href="referrals.html">
      <span>👥 إدارة شبكة الإحالات الخاصة بك</span>
      <span class="arrow">←</span>
    </a>
  </div>
</div>

<script src="https://unpkg.com/parse/dist/parse.min.js"></script>
<script src="./config.js"></script>
<script>
  try {
    if (window.GOLDX && window.GOLDX.PARSE_APP_ID) {
      Parse.initialize(window.GOLDX.PARSE_APP_ID, window.GOLDX.PARSE_JS_KEY);
      Parse.serverURL = window.GOLDX.PARSE_SERVER_URL;
    }
  } catch(e) {
    console.error("Parse init error:", e);
  }

  const user = Parse.User.current();
  if(user) {
    const name = user.get("username") || "User";
    document.getElementById("usernameTxt").textContent = name;
    document.getElementById("userInitial").textContent = name.charAt(0).toUpperCase();
  } else {
    location.href = "../auth/login.html";
  }

  function safeNum(n){ return (typeof n === "number" && isFinite(n)) ? n : 0; }

  async function getProfile(){
    if(!user) return null;
    try {
      const Profile = Parse.Object.extend("Profile");
      const q = new Parse.Query(Profile);
      q.equalTo("user", user);
      q.limit(1);
      return await q.first();
    } catch(e) {
      return null;
    }
  }

  async function loadDashboard(){
    try {
      const profile = await getProfile();
      if(profile) {
        const bal = safeNum(profile.get("virtualBalance")) || safeNum(profile.get("balance")) || 0;
        const isActive = !!profile.get("isActive");

        document.getElementById("balanceTxt").textContent = bal.toFixed(2);
        
        const badge = document.getElementById("statusBadge");
        if(isActive) {
          badge.className = "status-badge active";
          badge.textContent = "حساب نشط ومفعل";
        } else {
          badge.className = "status-badge inactive";
          badge.textContent = "غير نشط - يتطلب اشتراك";
        }
      }
    } catch(e) {
      console.error("Dashboard core logic load error:", e);
    }
  }

  document.getElementById("logoutBtn").onclick = async () => {
    try {
      await Parse.User.logOut();
    } catch(e) {}
    location.href = "../auth/login.html";
  };

  loadDashboard();
</script>
</body>
</html>
