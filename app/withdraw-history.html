<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>سجل السحوبات • GOLD-X</title>
  <style>
    :root {
      --gold: #ffd700;
      --bg: #0b0c10; /* أسود داكن فخم */
      --card-bg: #1f2128; /* رمادي داكن لبروز سجلات العمليات */
      --border-color: rgba(255, 215, 0, 0.15);
      --text-gray: #a8b3cf;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2e2600, var(--bg)); /* تدرج ذهبي فخم مشع */
      color: #eaf0ff;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 14px 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .btn {
      padding: 11px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: #eaf0ff;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: 0.3s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--gold);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--gold), #b8860b);
      border-color: transparent;
      color: #000;
    }
    .btn.primary:hover {
      background: linear-gradient(135deg, #ffe033, var(--gold));
      transform: translateY(-1px);
    }
    .card {
      margin-top: 14px;
      background: rgba(31, 33, 40, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    .item {
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.02);
      margin-top: 12px;
      transition: 0.3s;
    }
    .item:hover {
      border-color: rgba(255, 215, 0, 0.2);
      background: rgba(255, 215, 0, 0.01);
    }
    .muted {
      color: var(--text-gray);
      font-size: 13px;
      line-height: 1.7;
    }
    .mono {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      word-break: break-all;
    }
    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .pending {
      color: #ffcc66;
      background: rgba(255, 204, 102, 0.08);
      border: 1px solid rgba(255, 204, 102, 0.3);
    }
    .paid {
      color: #2cff8f;
      background: rgba(44, 255, 143, 0.08);
      border: 1px solid rgba(44, 255, 143, 0.3);
    }
    .rejected {
      color: #ff5a78;
      background: rgba(255, 90, 120, 0.08);
      border: 1px solid rgba(255, 90, 120, 0.3);
    }
    .highlight-gold {
      color: var(--gold);
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div style="font-weight:900; font-size: 18px; color: var(--gold);">سجل السحوبات</div>
      <div class="muted">عرض آخر 50 طلب مالي</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn" href="./dashboard.html">لوحة التحكم</a>
      <a class="btn primary" href="./withdraw-request.html">طلب سحب</a>
      <button class="btn" id="refreshBtn" style="background: rgba(255,215,0,0.1); color: var(--gold); border-color: rgba(255,215,0,0.2);">تحديث</button>
    </div>
  </div>

  <div class="card">
    <div class="muted" id="msg">—</div>
    <div id="list"></div>
  </div>
</div>

<script src="https://unpkg.com/parse/dist/parse.min.js"></script>
<script src="./config.js"></script>
<script>
  // ربط التهيئة بكائن المنصة الجديد GOLDX لتوحيد بيئة العمل
  Parse.initialize(window.GOLDX.PARSE_APP_ID, window.GOLDX.PARSE_JS_KEY);
  Parse.serverURL = window.GOLDX.PARSE_SERVER_URL;

  const user = Parse.User.current();
  if(!user) location.href = "../auth/login.html";

  const msg = (t)=> document.getElementById("msg").textContent = t;
  function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
  
  function fmtDate(d){
    if(!d) return "—";
    try{ return new Date(d).toLocaleString("ar", {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
    catch{ return "—"; }
  }
  
  function tag(status){
    status = (status||"pending").toLowerCase();
    if(status==="paid") return `<span class="tag paid">PAID</span>`;
    if(status==="rejected") return `<span class="tag rejected">REJECTED</span>`;
    return `<span class="tag pending">PENDING</span>`;
  }

  async function load(){
    msg("جاري التحميل...");
    list.innerHTML = "";

    const WithdrawRequests = Parse.Object.extend("WithdrawRequests");
    const q = new Parse.Query(WithdrawRequests);
    q.equalTo("user", user);
    q.descending("createdAt");
    q.limit(50);

    const rows = await q.find().catch(e=>{ msg(e.message||"خطأ أثناء جلب البيانات"); return []; });

    if(!rows.length){ msg("لا توجد طلبات سحب مسجلة بعد."); return; }
    msg("إجمالي عدد الطلبات: " + rows.length);

    rows.forEach(r=>{
      const el = document.createElement("div");
      const st = r.get("status") || "pending";
      el.className = "item";
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div><b>الحالة:</b> ${tag(st)}</div>
          <div class="muted"><b>التاريخ:</b> ${esc(fmtDate(r.createdAt))}</div>
        </div>
        <div style="margin-top:8px"><b>المبلغ المسحوب:</b> <span class="highlight-gold" style="font-weight:900;">${esc(r.get("amount"))} GOLD-X</span></div>
        <div style="margin-top:6px" class="muted"><b>المحفظة المستلمة:</b> <span class="mono" style="color: #fff;">${esc(r.get("wallet"))}</span></div>
        ${r.get("txHash") ? `<div style="margin-top:6px" class="muted"><b>معرّف المعاملة (TxHash):</b> <span class="mono highlight-gold">${esc(r.get("txHash"))}</span></div>` : ``}
        ${r.get("note") ? `<div style="margin-top:6px" class="muted"><b>ملاحظة الإدارة:</b> <span style="color: #fff;">${esc(r.get("note"))}</span></div>` : ``}
      `;
      list.appendChild(el);
    });
  }

  refreshBtn.onclick = load;
  load();
</script>
</body>
</html>
