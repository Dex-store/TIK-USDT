<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>انضم إلى GOLD-X</title>
  <style>
    :root { 
      --gold: #ffd700; 
      --bg: #0b0c10; /* أسود داكن فخم مائل للعمق */
      --card-bg: #1f2128; /* رمادي داكن جداً لبروز البطاقة */
    }
    body { 
      margin: 0; 
      font-family: system-ui, -apple-system, sans-serif; 
      background: var(--bg); 
      color: #fff; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 20px; 
    }
    .card { 
      width: 100%; 
      max-width: 420px; 
      background: var(--card-bg); 
      border: 1px solid rgba(255, 215, 0, 0.2); 
      border-radius: 24px; 
      padding: 35px 30px; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      box-sizing: border-box; 
    }
    h2 { 
      text-align: center; 
      color: var(--gold); 
      margin-top: 0;
      margin-bottom: 25px; 
      font-size: 26px;
      letter-spacing: 0.5px;
    }
    .input-group { 
      margin-bottom: 20px; 
    }
    label { 
      display: block; 
      margin-bottom: 8px; 
      font-size: 14px; 
      color: #c5c6c7; 
    }
    input { 
      width: 100%; 
      padding: 15px; 
      border-radius: 12px; 
      border: 1px solid #454b54; 
      background: #12141c; 
      color: #fff; 
      outline: none; 
      font-size: 16px; 
      box-sizing: border-box; 
      transition: 0.3s; 
    }
    input:focus { 
      border-color: var(--gold); 
      background: #161922; 
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
    }
    .submit-btn { 
      width: 100%; 
      padding: 16px; 
      border-radius: 12px; 
      border: none; 
      background: linear-gradient(135deg, var(--gold), #b8860b); 
      color: #000; 
      font-weight: 800; 
      font-size: 17px; 
      cursor: pointer; 
      margin-top: 10px; 
      transition: 0.3s; 
    }
    .submit-btn:hover {
      background: linear-gradient(135deg, #ffe033, var(--gold));
      transform: translateY(-1px);
    }
    .submit-btn:disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
      transform: none;
    }
    #msg { 
      text-align: center; 
      margin-top: 15px; 
      font-size: 14px; 
      min-height: 20px; 
    }
    .login-link { 
      text-align: center; 
      margin-top: 25px; 
      font-size: 14px; 
      color: #c5c6c7; 
    }
    .login-link a { 
      color: var(--gold); 
      text-decoration: none; 
      font-weight: bold; 
    }
    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>فتح حساب GOLD-X</h2>
    <div class="input-group">
      <label>البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="example@mail.com">
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="pass" placeholder="6 أحرف على الأقل">
    </div>
    <div class="input-group">
      <label>كود الدعوة (اختياري)</label>
      <input type="text" id="ref" placeholder="ABC123">
    </div>
    <button class="submit-btn" id="signupBtn">إنشاء الحساب فوراً</button>
    <div id="msg"></div>
    <div class="login-link">لديك حساب بالفعل؟ <a href="login.html">تسجيل دخول</a></div>
  </div>

  <script src="https://unpkg.com/parse/dist/parse.min.js"></script>
  <script src="../app/config.js"></script>
  <script>
    // تعديل كائنات التهيئة لتطابق التسمية الجديدة للمنصة GOLD-X في ملف config.js
    Parse.initialize(window.GOLDX.PARSE_APP_ID, window.GOLDX.PARSE_JS_KEY);
    Parse.serverURL = window.GOLDX.PARSE_SERVER_URL;

    // جلب الكود من الرابط تلقائياً
    const params = new URLSearchParams(window.location.search);
    if(params.has('ref')) document.getElementById('ref').value = params.get('ref');

    function createRefCode() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    document.getElementById('signupBtn').onclick = async function() {
      const btn = this;
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value.trim();
      const ref = document.getElementById('ref').value.trim();
      const msg = document.getElementById('msg');

      if(!email || pass.length < 6) {
        msg.innerHTML = "<span style='color:#ff5a78'>تأكد من البريد وكلمة المرور (6+)</span>";
        return;
      }

      btn.disabled = true;
      msg.style.color = "var(--gold)";
      msg.textContent = "جاري إنشاء حسابك الذهبي...";

      try {
        const user = new Parse.User();
        user.set("username", email);
        user.set("email", email);
        user.set("password", pass);
        user.set("refCode", createRefCode());
        user.set("pendingRefCode", ref);
        user.set("balance", 0.00);
        user.set("completedTasks", 0);

        await user.signUp();
        msg.style.color = "#2cff8f";
        msg.textContent = "نجح التسجيل! جاري الدخول...";
        setTimeout(() => location.href = "../app/dashboard.html", 1000);
      } catch (e) {
        btn.disabled = false;
        msg.style.color = "#ff5a78";
        msg.textContent = "خطأ: " + (e.message || "فشل التسجيل");
      }
    };
  </script>
</body>
</html>
